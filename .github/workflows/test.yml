# Tests every push to master and every pull request to it, and checks that the app still builds.
# The installers themselves are made by release.yml.
name: Build/test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn test

      # The webpack build is the real type check
      - run: yarn production
