# Builds the installers for Windows, macOS and Linux.
# - Started by hand (Actions, "Build installers", Run workflow): the files can be downloaded from the run.
# - A pushed tag v* (e.g. v1.0.0-beta.1): the same, and they are also put in a draft GitHub Release, to be
#   checked and published by hand. A tag with a "-" (a beta) makes it a pre-release. The updater of
#   installed copies reads the published releases; a beta also takes later betas.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  # Only to upload the files to a draft release
  contents: write

jobs:
  # The draft release is made once, before the three builds upload to it: left to them, each could make
  # one of its own at the same moment
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The builds upload to the release of the version in package.json: another tag would get none
      - name: Tag matches the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "The tag $TAG does not match the version $VERSION in package.json" >&2
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Draft release
        run: |
          PRERELEASE=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $PRERELEASE --title "Atlas ${TAG#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  build:
    needs: draft
    # Also when the draft was skipped (started by hand), not when it failed
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          # Apple Silicon; it builds the Intel version as well
          - os: macos-14
            platform: --mac
          - os: ubuntu-22.04
            platform: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Test
        if: runner.os == 'Linux'
        run: yarn test

      - run: yarn build

      - name: Package
        # Unsigned for now: no certificates are looked for (see docs/installer-plan.md)
        run: yarn electron-builder ${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
